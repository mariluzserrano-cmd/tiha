<style>
:root {
  --navy-deep: #06182E;
  --navy-soft: #0E2A4A;
  --teal: #13B5B1;
  --teal-dark: #0E8F8C;
  --coral: #EE6C4D;
  --gold: #F4B860;
  --ice: #EAF4FB;
  --white: #FFFFFF;
  --cream: #FFF8EB;
  --text: #14202E;
  --muted: #6b7a89;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  height: 100%;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  color: var(--text);
}

body {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px 12px;
  background:
    radial-gradient(1200px 600px at 15% -10%, rgba(19,181,177,0.35), transparent 60%),
    radial-gradient(900px 500px at 110% 10%, rgba(244,184,96,0.25), transparent 55%),
    linear-gradient(160deg, var(--navy-deep) 0%, var(--navy-soft) 55%, var(--navy-deep) 100%);
}

.app {
  width: 100%;
  max-width: 480px;
  height: min(760px, calc(100vh - 48px));
  background: var(--white);
  border-radius: 24px;
  box-shadow: 0 30px 60px -20px rgba(0,0,0,0.55), 0 0 0 1px rgba(255,255,255,0.06);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

header {
  background: linear-gradient(120deg, var(--navy-deep), var(--navy-soft) 60%, #123a5c);
  color: var(--white);
  padding: 20px 20px 16px;
  display: flex;
  align-items: center;
  gap: 14px;
  position: relative;
}

header::after {
  content: "";
  position: absolute;
  left: 0; right: 0; bottom: -1px;
  height: 4px;
  background: linear-gradient(to right, var(--teal), var(--gold), var(--coral));
}

.avatar {
  width: 46px;
  height: 46px;
  border-radius: 50%;
  object-fit: cover;
  background: var(--white);
  border: 2px solid rgba(255,255,255,0.35);
  flex-shrink: 0;
}

header .titulo { flex: 1; min-width: 0; }

header h1 {
  margin: 0;
  font-size: 1.2rem;
  letter-spacing: 0.2px;
}

header h1 em {
  color: var(--teal);
  font-style: italic;
  font-weight: 400;
}

header p {
  margin: 3px 0 0;
  font-size: 0.72rem;
  color: rgba(255,255,255,0.65);
}

#estado-conexion {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 0.7rem;
  color: var(--gold);
  margin-top: 4px;
  font-weight: 600;
}

#estado-conexion::before {
  content: "";
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: currentColor;
  box-shadow: 0 0 6px currentColor;
}

#estado-conexion.offline { color: var(--teal); }

.chips {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  padding: 12px 14px;
  background: var(--ice);
  border-bottom: 1px solid #d9e8f2;
}

.chip {
  border: 1px solid rgba(19,181,177,0.4);
  background: var(--white);
  color: var(--navy-deep);
  border-radius: 999px;
  padding: 7px 14px;
  font-size: 0.78rem;
  font-weight: 500;
  cursor: pointer;
  white-space: nowrap;
  transition: background 0.15s, color 0.15s, transform 0.1s, box-shadow 0.15s;
}

.chip:hover {
  background: var(--teal);
  color: var(--white);
  box-shadow: 0 4px 10px -4px rgba(19,181,177,0.6);
}

.chip:active { transform: scale(0.96); }

#chat-log {
  flex: 1;
  overflow-y: auto;
  padding: 18px 16px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  background:
    linear-gradient(var(--cream), var(--cream));
}

.msg {
  display: flex;
  align-items: flex-end;
  gap: 8px;
  max-width: 90%;
  animation: aparecer 0.2s ease-out;
}

@keyframes aparecer {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: translateY(0); }
}

.msg.user { align-self: flex-end; flex-direction: row-reverse; }
.msg.bot { align-self: flex-start; }

.msg-avatar {
  width: 26px;
  height: 26px;
  border-radius: 50%;
  object-fit: cover;
  flex-shrink: 0;
  background: var(--navy-deep);
}

.bubble {
  padding: 11px 15px;
  border-radius: 18px;
  line-height: 1.5;
  font-size: 0.91rem;
  white-space: normal;
  box-shadow: 0 2px 6px rgba(6,24,46,0.06);
}

.msg.bot .bubble {
  background: var(--white);
  border: 1px solid #eef3f6;
  border-bottom-left-radius: 5px;
}

.msg.user .bubble {
  background: linear-gradient(135deg, var(--teal), var(--teal-dark));
  color: var(--white);
  border-bottom-right-radius: 5px;
}

.bubble strong { color: var(--navy-deep); }
.msg.user .bubble strong { color: var(--white); }

.bubble a {
  color: var(--coral);
  font-weight: 700;
  text-decoration: underline;
}

.msg.user .bubble a { color: var(--white); }

.escribiendo .bubble {
  display: flex;
  gap: 4px;
  align-items: center;
  padding: 13px 17px;
}

.dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--teal);
  animation: parpadeo 1s infinite ease-in-out;
}

.dot:nth-child(2) { animation-delay: 0.15s; }
.dot:nth-child(3) { animation-delay: 0.3s; }

@keyframes parpadeo {
  0%, 80%, 100% { opacity: 0.25; transform: scale(0.85); }
  40% { opacity: 1; transform: scale(1); }
}

#chat-form {
  display: flex;
  gap: 8px;
  padding: 14px 16px;
  background: var(--white);
  border-top: 1px solid #eef3f6;
}

#chat-input {
  flex: 1;
  border: 1.5px solid #dbe7ee;
  border-radius: 999px;
  padding: 11px 18px;
  font-size: 0.92rem;
  outline: none;
  transition: border-color 0.15s;
}

#chat-input:focus { border-color: var(--teal); }

#chat-form button {
  background: linear-gradient(135deg, var(--coral), #d95a3d);
  color: var(--white);
  border: none;
  border-radius: 999px;
  width: 44px;
  height: 44px;
  flex-shrink: 0;
  font-weight: 600;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.1rem;
  transition: transform 0.1s, box-shadow 0.15s;
  box-shadow: 0 4px 10px -3px rgba(238,108,77,0.55);
}

#chat-form button:hover { transform: translateY(-1px); }
#chat-form button:active { transform: scale(0.94); }

footer {
  text-align: center;
  font-size: 0.66rem;
  color: var(--muted);
  padding: 8px 16px 12px;
  background: var(--white);
  border-top: 1px solid #f1f5f8;
}

footer strong { color: var(--navy-deep); }

#chat-log::-webkit-scrollbar { width: 6px; height: 6px; }
#chat-log::-webkit-scrollbar-thumb { background: #d6e4ec; border-radius: 6px; }

@media (max-width: 480px) {
  body { padding: 0; }
  .app { max-width: 100%; height: 100vh; border-radius: 0; }
}

</style>

/* Motor de reglas del Bot TIHA — coincidencia de palabras clave, 100% local. */

function normalizar(texto) {
  return texto
    .toLowerCase()
    .normalize("NFD")
    .replace(/[̀-ͯ]/g, "") // quita acentos
    .replace(/[^a-z0-9ñ\s]/g, " ")
    .replace(/\s+/g, " ")
    .trim();
}

function responderA(mensajeUsuario) {
  const texto = normalizar(mensajeUsuario);
  if (!texto) return FUERA_DE_TEMA;

  let mejor = null;
  let mejorPuntaje = 0;

  for (const intencion of INTENCIONES) {
    let puntaje = 0;
    for (const kw of intencion.keywords) {
      const kwNorm = normalizar(kw);
      if (texto.includes(kwNorm)) {
        // frases más largas / específicas pesan más
        puntaje += kwNorm.split(" ").length;
      }
    }
    if (puntaje > mejorPuntaje) {
      mejorPuntaje = puntaje;
      mejor = intencion;
    }
  }

  if (mejor) return mejor.respuesta();
  return FUERA_DE_TEMA;
}

function quitarEscribiendo() {
  const el = document.getElementById("escribiendo");
  if (el) el.remove();
}

function enviarMensaje(texto) {
  if (!texto.trim()) return;
  agregarMensaje(texto, "user");
  mostrarEscribiendo();
  const demora = 350 + Math.random() * 350;
  setTimeout(() => {
    quitarEscribiendo();
    const respuesta = responderA(texto);
    agregarMensaje(respuesta, "bot");
  }, demora);
}

form.addEventListener("submit", (e) => {
  e.preventDefault();
  const texto = input.value;
  input.value = "";
  enviarMensaje(texto);
});

chips.forEach((chip) => {
  chip.addEventListener("click", () => {
    enviarMensaje(chip.dataset.mensaje || chip.textContent);
  });
});

/* Mensaje de bienvenida al cargar */
window.addEventListener("DOMContentLoaded", () => {
  agregarMensaje(MENSAJE_BIENVENIDA, "bot");

  const estadoConexion = document.getElementById("estado-conexion");
  function actualizarEstado() {
    if (navigator.onLine) {
      estadoConexion.textContent = "En línea (pero funciono sin internet)";
      estadoConexion.classList.remove("offline");
    } else {
      estadoConexion.textContent = "Sin conexión — funcionando 100% local";
      estadoConexion.classList.add("offline");
    }
  }
  actualizarEstado();
  window.addEventListener("online", actualizarEstado);
  window.addEventListener("offline", actualizarEstado);
});

</script>
